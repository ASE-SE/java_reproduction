# ===============================================================
# Paths are RELATIVE to the java-scanner/ working directory (cwd at launch).
# Project root is the parent dir of java-scanner/, so data/ and repos/ are at ../
# ===============================================================

# Per-sample temporary checkout directory (written by ProjectHandler)
TMP_PROJECT_PATH=../data/temp_project

# LLM response cache root. Keep EXPERIMENT_MARK=E0502 to reuse cached replies.
EXPERIMENT_INTERMEDIATE_PROCESS_DATA_PATH=../data/experiment_detail

# Repo index (full_name -> clone_url). Already shipped in the repo.
REPOSITORY_INDEX_FILE=../data/collected_repos(1670).json

# Where JGit writes cloned repos. Only the ~46 repos referenced by the samples
# will be cloned on demand; not the full 1670. Move to a larger disk if needed.
REPOSITORY_DATA_PATH=../repos

# Cache namespace + log/output suffix. Each LLM model run gets its own MARK so caches don't
# collide. The paper's batches were E0401/E0502/E0506; for new model comparisons, use the model
# version string directly (e.g. deepseek-v4-flash, qwen-max-2024-09-19, gpt-4o-2024-08-06).
EXPERIMENT_MARK=qwen-max

# Input sample set (1594 method-level samples across 45 repos).
EXPERIMENT_SOURCE=../data/1594_input_data.json

# Output of this run. Start from an empty list to rebuild results; point to an
# existing file to resume (already-processed entries are skipped).
# Convention: name target as <EXPERIMENT_MARK>_output.json so each model run lands in its own file.
# When you switch MARK to a different model (e.g. EXPERIMENT_MARK=qwen-max-2024), update this too.
EXPERIMENT_TARGET=../data/qwen-max_output.json

# Subset selection (both optional). Empty / 0 = disabled.
#
# REPO_FILTER: comma-separated repo_id list. If non-empty, only samples whose
# repo_id matches one of these entries are processed. Example:
#     REPO_FILTER=Anuken/Mindustry,apache/beam
#
# SAMPLE_LIMIT: stop after this many total results have been written to
# EXPERIMENT_TARGET (0 = unlimited). Useful to cap wall-clock time.
REPO_FILTER=
SAMPLE_LIMIT=0

# ===============================================================
# Secrets -- FILL THESE IN LOCALLY, do NOT commit real values.
# ===============================================================

# LLM (OpenAI-compatible /chat/completions). Paper used DeepSeek / Qwen-max / ERNIE.
