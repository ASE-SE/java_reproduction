# Per-sample temporary checkout directory (written by ProjectHandler)
TMP_PROJECT_PATH=/home/lichenxu/bug_report_reproduction/java_exception/data/temp_project

# LLM response cache root. Keep EXPERIMENT_MARK=E0502 to reuse cached replies.
EXPERIMENT_INTERMEDIATE_PROCESS_DATA_PATH=/home/lichenxu/bug_report_reproduction/java_exception/data/experiment_detail

# Repo index (full_name -> clone_url). Already shipped in the repo.
REPOSITORY_INDEX_FILE=/home/lichenxu/bug_report_reproduction/java_exception/data/collected_repos(1670).json

# Where JGit writes cloned repos. Only the ~46 repos referenced by the samples
# will be cloned on demand; not the full 1670. Move to a larger disk if needed.
REPOSITORY_DATA_PATH=/home/lichenxu/bug_report_reproduction/java_exception/repos

# Must match the prefix of files under EXPERIMENT_INTERMEDIATE_PROCESS_DATA_PATH
# (e.g. "E0502+<method>.json") to hit the cached LLM responses for zero-cost reproduction.
EXPERIMENT_MARK=E0502

# Input sample set (the paper's E0502 batch).
EXPERIMENT_SOURCE=/home/lichenxu/bug_report_reproduction/java_exception/data/experiment_result_cleanE0502.json

# Output of this run. Start from an empty list to rebuild results; point to an
# existing file to resume (already-processed entries are skipped).
EXPERIMENT_TARGET=/home/lichenxu/bug_report_reproduction/java_exception/data/experiment_resultE0502-repro.json

# ===============================================================
# Secrets -- FILL THESE IN LOCALLY, do NOT commit real values.
# ===============================================================

# LLM (OpenAI-compatible /chat/completions). Paper used DeepSeek / Qwen-max / ERNIE.
LLM_API_KEY=<PUT_YOUR_LLM_KEY_HERE>
LLM_API_URL=https://api.deepseek.com/chat/completions
LLM_MODEL_NAME=deepseek-chat

# GitHub credentials for on-demand repo cloning (raises rate limits).
GITHUB_USERNAME=<PUT_YOUR_GITHUB_USERNAME_HERE>
GITHUB_TOKEN=<PUT_YOUR_GITHUB_TOKEN_HERE>
